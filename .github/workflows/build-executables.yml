name: Build Cross-Platform Executables

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [ created ]
  workflow_dispatch:  # Allow manual trigger

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
    
    - name: Build Windows executable
      run: |
        pyinstaller --onefile --windowed --name "NameGame" --add-data "sample-roster;sample-roster" --hidden-import tkinter --hidden-import PIL --hidden-import PIL.Image --hidden-import PIL.ImageTk --hidden-import PIL._tkinter_finder name_game.py
    
    - name: Upload Windows artifact
      uses: actions/upload-artifact@v4
      with:
        name: windows-executable
        path: dist/NameGame.exe
        retention-days: 30

  build-macos-arm64:
    runs-on: macos-latest  # Apple Silicon (M1/M2/M3)
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
    
    - name: Build macOS .app (ARM64)
      run: |
        pyinstaller --onedir --windowed --name "Name Game" --add-data "sample-roster:sample-roster" --osx-bundle-identifier "com.educator.studentnamegame" --hidden-import tkinter --hidden-import tkinter.ttk --hidden-import PIL --hidden-import PIL.Image --hidden-import PIL.ImageTk --target-arch arm64 --clean name_game.py
    
    - name: Create DMG (ARM64)
      run: |
        hdiutil create -volname "Name Game" -srcfolder "dist/Name Game.app" -ov -format UDZO "StudentNameGame-macOS-ARM64.dmg"
    
    - name: Upload macOS ARM64 DMG
      uses: actions/upload-artifact@v4
      with:
        name: macos-arm64-dmg
        path: StudentNameGame-macOS-ARM64.dmg
        retention-days: 30
    
    - name: Zip the .app (ditto keeps permissions the bundle needs)
      run: |
        ditto -c -k --keepParent "dist/Name Game.app" "NameGame-macOS-ARM64.zip"
    
    - name: Upload macOS ARM64 .app
      uses: actions/upload-artifact@v4
      with:
        name: macos-arm64-app
        path: NameGame-macOS-ARM64.zip
        retention-days: 30

  create-release:
    needs: [build-windows, build-macos-arm64]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
    
    - name: Upload Release Assets
      uses: softprops/action-gh-release@v1
      with:
        files: |
          windows-executable/NameGame.exe
          macos-arm64-dmg/StudentNameGame-macOS-ARM64.dmg
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
